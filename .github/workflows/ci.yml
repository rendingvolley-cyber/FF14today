name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: JavaScript syntax
        run: |
          node --check src/index.js
          node --check src/single-user.js
          node --check src/lodestone-achievements.js
          node --check src/concrete-plan.js
          node --check src/context-image.js
          node --check src/context-history-wrapper.js
          node --check src/context-opportunities.js
          node --check src/measurable-motive-wrapper.js
          node --check src/gather-window-wrapper.js
          node --check src/gather-ui-wrapper.js
          node --check src/grounded-discovery-wrapper.js
          node --check src/retainer-market-wrapper.js
          node --check src/retainer-first-wrapper.js
          node --check src/grand-company-deliveries.js
          node --check src/grand-company-wrapper.js
          node --check src/combat-job-focus.js
          node --check src/combat-job-wrapper.js
          node --check src/leve-cost-data.js
          node --check src/leve-cost-advisor.js
          node --check src/leve-cost-wrapper.js
          node --check public/app.js
          node --check public/choice-reasons.js
          node --check public/context-inbox.js
          node --check public/gather-checklist.js
          node --check public/retainer-advice.js
          node --check public/grand-company-routine.js
          node --check public/combat-job-switcher.js
          node --check public/tribe-leveling-data.js
          node --check public/focus-flow.js
          node --check public/leve-cost-advice.js
          node --check scripts/test-grand-company-deliveries.mjs
          node --check scripts/playwright.config.mjs
          node --check scripts/e2e/focus-flow-boot.spec.mjs
      - name: Context planning rules
        run: node scripts/test-context-opportunities.mjs
      - name: Measurable motive rules
        run: node scripts/test-measurable-motives.mjs
      - name: Gather checklist rules
        run: node scripts/test-gather-window-ux.mjs
      - name: Grounded discovery rules
        run: node scripts/test-grounded-discovery.mjs
      - name: Combat job focus rules
        run: node scripts/test-combat-job-focus.mjs
      - name: Tribe leveling guide rules
        run: node scripts/test-tribe-leveling-guide.mjs
      - name: Focus flow rules
        run: node scripts/test-focus-flow.mjs
      - name: Leve cost advisor rules
        run: node scripts/test-leve-cost-advisor.mjs
      - name: Grand Company delivery rules
        run: node scripts/test-grand-company-deliveries.mjs
      - name: Browser boot regression
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Wrangler config JSON
        run: node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); console.log('wrangler.jsonc OK')"
      - name: Secret pattern scan
        run: |
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo 'Potential Google API key found in repository'
            exit 1
          fi
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
