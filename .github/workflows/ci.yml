name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'ff14today-v2-*'
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: V2 JavaScript syntax
        run: |
          node --check src/v2-entry.js
          node --check src/single-user.js
          node --check src/lodestone-achievements.js
          node --check src/time-sensitive-game-windows.js
          node --check src/task-board-live-catalog.js
          node --check public/v2.js
      - name: V2 homepage contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'v2 · ON DEMAND' public/index.html
          grep -q '無人島' public/index.html
          grep -q 'アチーブ候補を取得' public/index.html
          grep -q '時限採集を取得' public/index.html
          grep -q 'まとめて取得' public/index.html
          ! grep -q '遊べる時間' public/index.html
          ! grep -q '気力' public/index.html
          ! grep -q 'レベルレ済み' public/index.html
          ! grep -q 'アラルレ済み' public/index.html
          ! grep -q '双蛇党' public/index.html
          ! grep -q 'モブハント' public/index.html
          ! grep -q 'スクショ' public/index.html
          ! grep -q 'ポケモン総当たり' public/index.html
      - name: Worker API contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'src/v2-entry.js' wrangler.jsonc
          grep -q 'achievement_candidates: true' src/v2-entry.js
          grep -q 'timed_gathering_on_demand: true' src/v2-entry.js
          grep -q 'fishing_on_demand: true' src/v2-entry.js
          grep -q 'not_available_in_v2' src/v2-entry.js
      - name: Wrangler config JSON
        run: node -e "JSON.parse(require('fs').readFileSync('wrangler.jsonc','utf8')); console.log('wrangler.jsonc OK')"
      - name: Secret pattern scan
        run: |
          if grep -RInE 'AIza[0-9A-Za-z_-]{20,}' . --exclude-dir=.git --exclude-dir=node_modules; then
            echo 'Potential Google API key found in repository'
            exit 1
          fi
      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
