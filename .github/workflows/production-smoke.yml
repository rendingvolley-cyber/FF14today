name: Production Smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark production smoke pending
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"production-smoke\",\"description\":\"Waiting for FF14 Today leveling production\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Verify live HTTP surface and APIs
        id: http_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ff14-today.ff14-today.workers.dev"
          ok=0
          for attempt in $(seq 1 18); do
            root="$(curl -fsS --max-time 20 "${BASE}/" || true)"
            health="$(curl -fsS --max-time 20 "${BASE}/api/health" || true)"
            if [[ "$root" == *"v2 · LEVELING"* && "$health" == *'"version": "2.1.0"'* ]]; then
              ok=1
              break
            fi
            sleep 10
          done
          [[ "$ok" == "1" ]]
          [[ "$root" == *"上げたいジョブ"* ]]
          [[ "$root" == *"無人島"* ]]
          [[ "$root" == *"時限採集を取得"* ]]
          [[ "$root" == *"まとめて取得"* ]]
          [[ "$root" != *"アチーブ候補を取得"* ]]
          [[ "$root" != *"PICK A VIBE"* ]]
          [[ "$root" != *"双蛇党"* ]]
          [[ "$root" != *"モブハント"* ]]
          [[ "$root" != *"スクショ"* ]]
          [[ "$health" == *'"screenshot_import": false'* ]]
          [[ "$health" == *'"achievement_candidates": false'* ]]
          [[ "$health" == *'"leveling_advisor": true'* ]]
          [[ "$health" == *'"timed_gathering_on_demand": true'* ]]
          [[ "$health" == *'"fishing_on_demand": true'* ]]

          profile="$(curl -fsS --max-time 30 "${BASE}/api/profile")"
          gathering="$(curl -fsS --max-time 60 "${BASE}/api/gathering/timed")"
          fishing="$(curl -fsS --max-time 60 "${BASE}/api/fishing/candidates?mode=all")"
          achievement_status="$(curl -sS --max-time 30 -o /tmp/achievement.json -w '%{http_code}' "${BASE}/api/achievements/candidates?limit=3")"
          [[ "$profile" == *'"ok": true'* ]]
          [[ "$profile" == *'"character"'* ]]
          [[ "$gathering" == *'"ok": true'* ]]
          [[ "$gathering" == *'"rows"'* ]]
          [[ "$fishing" == *'"ok": true'* ]]
          [[ "$fishing" == *'"fisher_level"'* ]]
          [[ "$achievement_status" == "404" ]]

      - name: Checkout
        if: steps.http_smoke.outcome == 'success'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.http_smoke.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.http_smoke.outcome == 'success'
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        if: steps.http_smoke.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Verify production in a real browser
        id: browser_smoke
        if: steps.http_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          page.setDefaultTimeout(90000);
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', err => pageErrors.push(String(err?.stack || err)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          const response = await page.goto('https://ff14-today.ff14-today.workers.dev/', { waitUntil: 'domcontentloaded', timeout: 45000 });
          if (!response || !response.ok()) throw new Error(`navigation failed: ${response?.status()}`);
          await page.waitForTimeout(2500);
          const snapshot = await page.evaluate(() => ({
            title: document.title,
            bodyText: document.body?.innerText || '',
            rank: document.getElementById('islandRank')?.value || '',
            hasLeveling: Boolean(document.getElementById('levelJobSelect')),
            hasAchievement: Boolean(document.getElementById('achievementButton')),
            hasGather: Boolean(document.getElementById('gatherButton')),
            fishButtons: document.querySelectorAll('[data-fish-mode]').length
          }));
          if (!snapshot.bodyText.includes('FF14 Today')) throw new Error('FF14 Today shell is not rendered');
          if (!snapshot.bodyText.includes('レベル上げ')) throw new Error('leveling area is missing');
          if (!snapshot.bodyText.includes('時間が余ったら')) throw new Error('on-demand area is missing');
          if (!snapshot.rank) throw new Error('Island Sanctuary rank selector is missing');
          if (!snapshot.hasLeveling || snapshot.hasAchievement || !snapshot.hasGather || snapshot.fishButtons < 3) throw new Error('main controls are incorrect');

          const firstJob = await page.locator('#levelJobSelect option:not([value=""])').first().getAttribute('value');
          if (!firstJob) throw new Error('no levelable job options found');
          await page.locator('#levelJobSelect').selectOption(firstJob);
          await page.locator('#levelingResult .method-row').first().waitFor({ state: 'visible' });
          const levelingText = await page.locator('#levelingResult').innerText();
          if (!levelingText.trim()) throw new Error('leveling recommendations are empty');
          if (levelingText.includes('ルーレット') || levelingText.includes('友好部族') || levelingText.includes('グランドカンパニー') || levelingText.includes('リーヴ')) {
            throw new Error(`forbidden leveling recommendation surfaced: ${levelingText}`);
          }

          await page.locator('#gatherButton').click();
          await page.locator('#gatherResult .result-row').first().waitFor({ state: 'visible' });
          const gatheringText = await page.locator('#gatherResult').innerText();
          if (gatheringText.includes('取得失敗')) throw new Error(`gathering action failed: ${gatheringText}`);

          await page.locator('[data-fish-mode="all"]').click();
          await page.locator('#fishResult .result-row').first().waitFor({ state: 'visible' });
          const fishingText = await page.locator('#fishResult').innerText();
          if (fishingText.includes('取得失敗')) throw new Error(`fishing action failed: ${fishingText}`);

          console.log(JSON.stringify({ snapshot, firstJob, levelingText, gatheringText, fishingText, pageErrors, consoleErrors }, null, 2));
          if (pageErrors.length) throw new Error(`pageerror: ${pageErrors.join(' | ')}`);
          if (consoleErrors.length) throw new Error(`console error: ${consoleErrors.join(' | ')}`);
          await page.screenshot({ path: 'production-smoke.png', fullPage: true });
          await browser.close();
          NODE

      - name: Upload browser smoke screenshot
        if: always() && steps.browser_smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke
          path: production-smoke.png
          if-no-files-found: ignore

      - name: Publish production smoke status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HTTP_OUTCOME: ${{ steps.http_smoke.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_smoke.outcome }}
        run: |
          if [[ "$HTTP_OUTCOME" == "success" && "$BROWSER_OUTCOME" == "success" ]]; then
            state="success"
            description="FF14 Today leveling production smoke passed"
          else
            state="failure"
            description="FF14 Today leveling production smoke failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"production-smoke\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Fail when production smoke failed
        if: steps.http_smoke.outcome != 'success' || steps.browser_smoke.outcome != 'success'
        run: exit 1
