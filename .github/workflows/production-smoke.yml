name: Production Smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Mark production smoke pending
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"production-smoke\",\"description\":\"Waiting for Cloudflare production convergence\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Wait for Cloudflare deployment and verify live app
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ff14-today.ff14-today.workers.dev"
          ok=0
          for attempt in $(seq 1 24); do
            echo "production smoke attempt ${attempt}/24"
            root="$(curl -fsS --max-time 15 "${BASE}/" || true)"
            hunt_js="$(curl -fsS --max-time 15 "${BASE}/hunt-section.js" || true)"
            health="$(curl -fsS --max-time 15 "${BASE}/api/health" || true)"

            if [[ "$root" == *"PICK A VIBE"* ]] \
              && [[ "$root" == *"スクショを判断材料に追加"* ]] \
              && [[ "$root" != *"TODAY TASK BOARD"* ]] \
              && [[ "$hunt_js" == *"TODAY'S HUNT"* ]] \
              && [[ "$hunt_js" == *"/api/hunts/today"* ]] \
              && [[ "$health" == *"daily_hunt_section"* ]]; then
              ok=1
              break
            fi
            sleep 10
          done

          if [[ "$ok" -ne 1 ]]; then
            echo "Production did not converge to the expected DAILY ROUTINE + hunt integration."
            exit 1
          fi

          echo "Production smoke passed: static DAILY ROUTINE shell preserved and hunt integration is live."

      - name: Publish production smoke status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          if [[ "$SMOKE_OUTCOME" == "success" ]]; then
            state="success"
            description="Production DAILY ROUTINE + hunt smoke passed"
          else
            state="failure"
            description="Production smoke failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"production-smoke\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Fail when production smoke failed
        if: steps.smoke.outcome != 'success'
        run: exit 1
