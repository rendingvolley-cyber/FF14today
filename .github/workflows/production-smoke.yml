name: Production Smoke

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Mark production smoke pending
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"production-smoke\",\"description\":\"Waiting for FF14 Today Japanese production\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Verify live HTTP surface and APIs
        id: http_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://ff14-today.ff14-today.workers.dev"
          ok=0
          for attempt in $(seq 1 18); do
            root="$(curl -fsS --max-time 20 "${BASE}/" || true)"
            health="$(curl -fsS --max-time 20 "${BASE}/api/health" || true)"
            if [[ "$root" == *"2.2・実行手順版"* && "$health" == *'"version": "2.2.0"'* ]]; then
              ok=1
              break
            fi
            sleep 10
          done
          [[ "$ok" == "1" ]]
          [[ "$root" == *"エオルゼア個人用ツール"* ]]
          [[ "$root" == *"キャラクター"* ]]
          [[ "$root" == *"ロードストーン同期"* ]]
          [[ "$root" == *"無人島開拓"* ]]
          [[ "$root" == *"時間が余ったら"* ]]
          [[ "$root" == *"上げたいジョブ"* ]]
          [[ "$root" == *"先に揃える素材"* ]]
          [[ "$root" == *"この順番でやる"* ]]
          [[ "$root" != *"Lodestone"* ]]
          [[ "$root" != *"ACTIONABLE"* ]]
          [[ "$root" != *"ISLAND SANCTUARY"* ]]
          [[ "$root" != *"WHEN YOU HAVE TIME"* ]]
          [[ "$root" != *"MONEY MAKING"* ]]
          [[ "$root" != *"EORZEA PERSONAL TOOL"* ]]
          [[ "$health" == *'"screenshot_import": false'* ]]
          [[ "$health" == *'"achievement_candidates": false'* ]]
          [[ "$health" == *'"leveling_advisor": true'* ]]
          [[ "$health" == *'"actionable_steps": true'* ]]
          [[ "$health" == *'"island_material_shortage": true'* ]]

          profile="$(curl -fsS --max-time 30 "${BASE}/api/profile")"
          gathering="$(curl -fsS --max-time 60 "${BASE}/api/gathering/timed")"
          fishing="$(curl -fsS --max-time 60 "${BASE}/api/fishing/candidates?mode=all")"
          [[ "$profile" == *'"ok": true'* ]]
          [[ "$profile" == *'"character"'* ]]
          [[ "$gathering" == *'"ok": true'* ]]
          [[ "$fishing" == *'"ok": true'* ]]
          [[ "$fishing" != *"Dryskthota"* ]]
          [[ "$fishing" != *"Merchant & Mender"* ]]

      - name: Checkout
        if: steps.http_smoke.outcome == 'success'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.http_smoke.outcome == 'success'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.http_smoke.outcome == 'success'
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        if: steps.http_smoke.outcome == 'success'
        run: npx playwright install --with-deps chromium

      - name: Verify production in a real browser
        id: browser_smoke
        if: steps.http_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from '@playwright/test';
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 1000 } });
          page.setDefaultTimeout(90000);
          const pageErrors = [];
          const consoleErrors = [];
          page.on('pageerror', err => pageErrors.push(String(err?.stack || err)));
          page.on('console', msg => { if (msg.type() === 'error') consoleErrors.push(msg.text()); });
          const response = await page.goto('https://ff14-today.ff14-today.workers.dev/', { waitUntil: 'domcontentloaded', timeout: 45000 });
          if (!response || !response.ok()) throw new Error(`navigation failed: ${response?.status()}`);
          await page.waitForTimeout(2500);

          const assertNoEnglish = (label, text) => {
            const matches = String(text).match(/[A-Za-z]{2,}/g);
            if (matches?.length) throw new Error(`${label} に英語表示が残っています: ${[...new Set(matches)].join(', ')}\n${text}`);
            if (/[XY]:\s*\d/.test(String(text))) throw new Error(`${label} に英字座標が残っています: ${text}`);
          };

          const bodyText = await page.locator('body').innerText();
          for (const forbidden of ['ACTIONABLE','ISLAND SANCTUARY','WHEN YOU HAVE TIME','MONEY MAKING','EORZEA PERSONAL TOOL','Lodestone']) {
            if (bodyText.includes(forbidden)) throw new Error(`英語の固定表示が残っています: ${forbidden}`);
          }

          const options = await page.locator('#levelJobSelect option').evaluateAll(nodes => nodes.map(node => node.value).filter(Boolean));
          let samText = '';
          for (const code of options) {
            await page.locator('#levelJobSelect').selectOption(code);
            await page.locator('#levelingResult .method-row').first().waitFor({ state: 'visible' });
            const text = await page.locator('#levelingResult').innerText();
            assertNoEnglish(`レベル上げ ${code}`, text);
            if (code === 'SAM') samText = text;
          }
          if (!samText.includes('オリジェニクス')) throw new Error(`侍レベル99はオリジェニクスを表示する必要があります: ${samText}`);
          if (!samText.includes('コンテンツファインダー')) throw new Error('戦闘手順にコンテンツファインダーがありません');
          if (!samText.includes('終わり：')) throw new Error('戦闘手順に完了条件がありません');

          for (let rank = 3; rank <= 15; rank += 1) {
            await page.locator('#islandRank').selectOption(String(rank));
            await page.waitForTimeout(20);
            const text = await page.locator('.island-main').innerText();
            assertNoEnglish(`無人島 開拓ランク${rank}`, text);
          }
          await page.locator('#islandRank').selectOption('3');
          const limestone = page.locator('input[data-island-material="石灰岩"]');
          await limestone.waitFor({ state: 'visible' });
          if (await limestone.getAttribute('data-target') !== '20') throw new Error('開拓ランク3の石灰岩必要数は20');
          await limestone.fill('5');
          const shortageId = await limestone.getAttribute('data-shortage-id');
          const shortageText = await page.locator(`#${shortageId}`).innerText();
          if (!shortageText.includes('不足 15')) throw new Error(`不足計算に失敗: ${shortageText}`);
          const islandText = await page.locator('.island-main').innerText();
          if (!islandText.includes('工房 1を2棟')) throw new Error(`工房の日本語表示がありません: ${islandText}`);
          if (!islandText.includes('完了条件')) throw new Error('無人島の完了条件がありません');

          await page.locator('#gatherButton').click();
          await page.locator('#gatherResult .result-row').first().waitFor({ state: 'visible' });
          const gatheringText = await page.locator('#gatherResult').innerText();
          if (gatheringText.includes('取得失敗')) throw new Error(`時限採集取得失敗: ${gatheringText}`);
          assertNoEnglish('時限採集', gatheringText);

          await page.locator('[data-fish-mode="all"]').click();
          await page.locator('#fishResult .result-row').first().waitFor({ state: 'visible' });
          const fishingText = await page.locator('#fishResult').innerText();
          if (fishingText.includes('取得失敗')) throw new Error(`釣り取得失敗: ${fishingText}`);
          assertNoEnglish('釣り', fishingText);

          console.log(JSON.stringify({ samText, shortageText, islandText, gatheringText, fishingText, checkedJobs: options.length, pageErrors, consoleErrors }, null, 2));
          if (pageErrors.length) throw new Error(`pageerror: ${pageErrors.join(' | ')}`);
          if (consoleErrors.length) throw new Error(`console error: ${consoleErrors.join(' | ')}`);
          await page.screenshot({ path: 'production-smoke.png', fullPage: true });
          await browser.close();
          NODE

      - name: Upload browser smoke screenshot
        if: always() && steps.browser_smoke.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke
          path: production-smoke.png
          if-no-files-found: ignore

      - name: Publish production smoke status
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HTTP_OUTCOME: ${{ steps.http_smoke.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser_smoke.outcome }}
        run: |
          if [[ "$HTTP_OUTCOME" == "success" && "$BROWSER_OUTCOME" == "success" ]]; then
            state="success"
            description="FF14 Today Japanese production smoke passed"
          else
            state="failure"
            description="FF14 Today Japanese production smoke failed"
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${state}\",\"context\":\"production-smoke\",\"description\":\"${description}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Fail when production smoke failed
        if: steps.http_smoke.outcome != 'success' || steps.browser_smoke.outcome != 'success'
        run: exit 1
