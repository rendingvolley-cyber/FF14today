<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ポケモン総当たり戦</title>
  <style>
    :root{
      color-scheme:dark;--bg:#070b16;--panel:#10182b;--line:#2b3b61;--text:#f8fafc;
      --muted:#9fb0cf;--accent:#ffd84d;--accent2:#5ed7ff;--win:#63e6a6;--loss:#ff7c90;
    }
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;
      font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);
      background:radial-gradient(circle at 12% 0%,rgba(94,215,255,.12),transparent 28rem),radial-gradient(circle at 88% 8%,rgba(255,216,77,.11),transparent 24rem),var(--bg)}
    button,input{font:inherit}button{touch-action:manipulation}.app{width:min(1540px,100%);margin:0 auto;padding:22px 24px 48px}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0 18px;border-bottom:1px solid rgba(159,176,207,.18)}
    .brand-row{display:flex;align-items:center;gap:14px;min-width:0}.ball{width:48px;height:48px;border-radius:50%;flex:0 0 auto;background:linear-gradient(#ff5167 0 46%,#f8fafc 46% 54%,#f8fafc 54%);border:3px solid #0a0f1d;box-shadow:0 0 0 1px #415274,0 8px 22px rgba(0,0,0,.3);position:relative}
    .ball:before{content:"";position:absolute;left:0;right:0;top:21px;height:5px;background:#0a0f1d}.ball:after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#f8fafc;border:4px solid #0a0f1d;left:50%;top:50%;transform:translate(-50%,-50%)}
    .eyebrow{margin:0 0 3px;font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--accent2)}h1{margin:0;font-size:clamp(25px,3vw,42px);line-height:1.05;letter-spacing:-.035em}
    .top-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.btn,.link-btn{border:1px solid var(--line);background:rgba(21,31,54,.9);color:var(--text);border-radius:999px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.btn-accent{background:var(--accent);color:#17140a;border-color:transparent}.btn-danger{color:#ffd2da}
    .hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(520px,1.1fr);gap:16px;margin-top:18px}.panel{background:linear-gradient(180deg,rgba(21,31,54,.96),rgba(13,20,37,.96));border:1px solid rgba(91,116,163,.4);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.18);overflow:hidden}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 18px 12px}.panel-head h2{margin:0;font-size:18px}.progress{font-size:13px;font-weight:800;color:var(--muted)}.muted{color:var(--muted)}
    .rule-note{margin:0;padding:0 18px 12px;color:var(--muted);font-size:12px}.standings{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.standings th,.standings td{padding:12px 16px;border-top:1px solid rgba(77,101,145,.24);text-align:center}.standings th{color:var(--muted);font-size:12px;letter-spacing:.08em}.standings th:nth-child(2),.standings td:nth-child(2){text-align:left}.standings td{font-size:clamp(16px,1.8vw,23px);font-weight:780}.rank{color:var(--accent);width:56px}.wins{color:var(--accent2)}
    .round-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:0 14px 13px}.round-tab{border:1px solid var(--line);background:#0d1528;color:var(--muted);border-radius:11px;padding:10px 4px;font-weight:900;cursor:pointer}.round-tab.active{background:var(--accent);color:#18140a;border-color:transparent}
    .round-body{display:grid;gap:9px;padding:0 14px 14px}.match{display:grid;grid-template-columns:76px minmax(0,1fr) 42px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;border:1px solid rgba(91,116,163,.34);border-radius:14px;background:rgba(6,11,24,.52)}.match.next{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,216,77,.3) inset}.match-no{font-size:12px;font-weight:900;color:var(--accent);text-align:center}.match-no small{display:block;color:var(--muted);font-size:10px;margin-top:2px}
    .player-button{min-width:0;min-height:48px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);color:var(--text);background:#16223c;font-weight:850;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-button.winner{color:#071b12;background:var(--win);border-color:transparent}.player-button.loser{color:#ffdce2;background:#3d1724;border-color:#753147}.vs{text-align:center;color:var(--muted);font-weight:900;font-size:12px}.mini{border:1px solid var(--line);background:#0e172a;color:var(--muted);border-radius:9px;min-height:42px;padding:0 10px;font-weight:800;cursor:pointer}.bye{text-align:center;color:var(--muted);border:1px dashed #324469;border-radius:12px;padding:8px 12px;font-size:13px}
    .section{margin-top:16px}.matrix-wrap{overflow-x:auto;padding:0 14px 14px}.matrix{border-collapse:separate;border-spacing:5px;width:100%;min-width:800px;table-layout:fixed}.matrix th{color:var(--muted);font-size:12px;padding:7px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.matrix th:first-child{width:150px;text-align:left}.matrix td{text-align:center;height:44px;border-radius:9px;font-weight:900;background:#0c1425;border:1px solid rgba(77,101,145,.25)}.matrix td.self{color:#53617a;background:transparent;border-style:dashed}.matrix td.win{color:#071b12;background:var(--win);border-color:transparent}.matrix td.loss{color:#ffe0e5;background:#552033;border-color:#783248}.matrix td.pending{color:#667797}
    details.setup>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:850;display:flex;justify-content:space-between;align-items:center}details.setup>summary::-webkit-details-marker{display:none}.setup-body{padding:0 18px 18px;border-top:1px solid rgba(77,101,145,.24)}.field-label{display:block;margin:14px 0 6px;color:var(--muted);font-size:12px;font-weight:850;letter-spacing:.06em}.text-input{width:100%;min-height:46px;background:#0a1223;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 11px}.player-inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.setup-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.footer-note{margin:16px 2px 0;color:#7f91b2;font-size:12px}
    body.tv-mode .edit-only,body.tv-mode details.setup,body.tv-mode .matrix-panel{display:none!important}body.tv-mode .app{width:min(1700px,100%);padding:22px 28px 28px}body.tv-mode .hero{grid-template-columns:.82fr 1.18fr}body.tv-mode .panel-head h2{font-size:clamp(20px,2vw,30px)}body.tv-mode .standings td{padding-top:14px;padding-bottom:14px;font-size:clamp(19px,2.4vw,32px)}body.tv-mode .match{grid-template-columns:92px minmax(0,1fr) 52px minmax(0,1fr);padding:14px}body.tv-mode .match .mini{display:none}body.tv-mode .player-button{pointer-events:none;min-height:60px;font-size:clamp(18px,2vw,28px)}body.tv-mode .match-no{font-size:16px}body.tv-mode .round-tab{padding:12px 5px;font-size:17px}
    @media(max-width:980px){.app{padding:16px 14px 36px}.hero{grid-template-columns:1fr}.player-inputs{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start}}@media(max-width:650px){.topbar{flex-direction:column}.top-actions{width:100%;justify-content:flex-start}.round-tabs{grid-template-columns:repeat(4,1fr)}.match{grid-template-columns:58px minmax(0,1fr) 30px minmax(0,1fr)}.match .mini{grid-column:1/-1;justify-self:center}.standings th,.standings td{padding-left:8px;padding-right:8px}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand-row"><span class="ball" aria-hidden="true"></span><div><p class="eyebrow">ROUND ROBIN SCOREBOARD</p><h1 id="eventTitleDisplay">ポケモン総当たり戦</h1></div></div>
    <div class="top-actions"><button id="tvButton" class="btn btn-accent" type="button">TV表示</button><button id="backupButton" class="btn edit-only" type="button">バックアップ</button><a class="link-btn" href="/">FF14 Todayへ</a></div>
  </header>

  <section class="hero" aria-label="大会状況">
    <article class="panel">
      <div class="panel-head"><h2>順位表</h2><span id="overallProgress" class="progress">0 / 21 試合</span></div>
      <p class="rule-note">順位：勝数 → 同勝数なら直接対決の勝者を上位</p>
      <table class="standings"><thead><tr><th>順位</th><th>プレイヤー</th><th>勝</th><th>敗</th></tr></thead><tbody id="standingsBody"></tbody></table>
    </article>
    <article class="panel">
      <div class="panel-head"><h2 id="roundHeading">第1ラウンド</h2><span id="roundProgress" class="progress">0 / 3</span></div>
      <div id="roundTabs" class="round-tabs"></div><div id="roundBody" class="round-body"></div>
    </article>
  </section>

  <section class="section panel matrix-panel"><div class="panel-head"><h2>総当たり表</h2><span class="progress">W 勝ち / L 負け</span></div><div class="matrix-wrap"><table id="matrix" class="matrix"></table></div></section>

  <details class="section panel setup edit-only"><summary><span>大会設定・参加者名</span><span class="muted">タップして編集</span></summary><div class="setup-body">
    <label class="field-label" for="eventTitleInput">大会名</label><input id="eventTitleInput" class="text-input" maxlength="40" value="ポケモン総当たり戦">
    <span class="field-label">参加者（7人）</span><div id="playerInputs" class="player-inputs"></div>
    <div class="setup-actions"><button id="applyNamesButton" class="btn btn-accent" type="button">名前を反映</button><button id="importButton" class="btn" type="button">バックアップ読込</button><button id="resetResultsButton" class="btn btn-danger" type="button">結果だけリセット</button><button id="resetAllButton" class="btn btn-danger" type="button">全データ初期化</button><input id="importFile" type="file" accept="application/json" hidden></div>
  </div></details>
  <p class="footer-note edit-only">勝ったプレイヤー名をタップすると結果を記録します。黄色枠が次の対戦です。結果はこのiPadに自動保存されます。</p>
</main>
<script>
(()=>{
  const KEY="pokemon-round-robin-v2"; const DEFAULT=["プレイヤー1","プレイヤー2","プレイヤー3","プレイヤー4","プレイヤー5","プレイヤー6","プレイヤー7"]; const $=id=>document.getElementById(id); let selectedRound=0;
  const initial=()=>({title:"ポケモン総当たり戦",players:[...DEFAULT],results:{}});
  function load(){try{const p=JSON.parse(localStorage.getItem(KEY)||"null");if(!p||!Array.isArray(p.players)||p.players.length!==7||typeof p.results!=="object")return initial();return{title:String(p.title||"ポケモン総当たり戦"),players:p.players.map((v,i)=>String(v||DEFAULT[i])),results:p.results||{}}}catch{return initial()}}
  let state=load(); const save=()=>localStorage.setItem(KEY,JSON.stringify(state)); const key=(a,b)=>[a,b].sort((x,y)=>x-y).join("-"); const result=(a,b)=>state.results[key(a,b)]??null;
  function makeRounds(n){const ghost=n,list=Array.from({length:n},(_,i)=>i).concat(ghost),rounds=[];for(let r=0;r<list.length-1;r++){const matches=[];let bye=null;for(let i=0;i<list.length/2;i++){const a=list[i],b=list[list.length-1-i];if(a===ghost)bye=b;else if(b===ghost)bye=a;else matches.push(r%2===0?[a,b]:[b,a])}rounds.push({matches,bye});list.splice(1,0,list.pop())}return rounds}
  const rounds=makeRounds(7); const flat=rounds.flatMap((r,ri)=>r.matches.map((m,mi)=>({round:ri,index:mi,no:ri*3+mi+1,a:m[0],b:m[1]})));
  function setResult(a,b,winner){if(winner===null)delete state.results[key(a,b)];else state.results[key(a,b)]=String(winner);save();render()}
  function records(){const rows=state.players.map((name,index)=>({index,name,w:0,l:0}));for(const m of flat){const w=result(m.a,m.b);if(w===null)continue;const wi=Number(w);if(wi!==m.a&&wi!==m.b)continue;const li=wi===m.a?m.b:m.a;rows[wi].w++;rows[li].l++}
    rows.sort((a,b)=>{if(b.w!==a.w)return b.w-a.w;const h=result(a.index,b.index);if(h!==null){if(Number(h)===a.index)return-1;if(Number(h)===b.index)return 1}return a.index-b.index});
    rows.forEach((row,i)=>row.rank=i+1);return rows}
  function nextMatchNo(){const m=flat.find(x=>result(x.a,x.b)===null);return m?m.no:null}
  function renderStandings(){const body=$("standingsBody");body.replaceChildren(...records().map(r=>{const tr=document.createElement("tr");[[r.rank,"rank"],[r.name,""],[r.w,"wins"],[r.l,""]].forEach(([v,c])=>{const td=document.createElement("td");td.textContent=v;if(c)td.className=c;tr.append(td)});return tr}));const done=flat.filter(m=>result(m.a,m.b)!==null).length;$("overallProgress").textContent=`${done} / 21 試合`}
  function renderRounds(){const tabs=$("roundTabs");tabs.replaceChildren(...rounds.map((r,i)=>{const done=r.matches.filter(([a,b])=>result(a,b)!==null).length,b=document.createElement("button");b.type="button";b.className=`round-tab${i===selectedRound?" active":""}`;b.textContent=`${i+1}${done===3?" ✓":""}`;b.onclick=()=>{selectedRound=i;renderRounds()};return b}));
    const r=rounds[selectedRound],done=r.matches.filter(([a,b])=>result(a,b)!==null).length,next=nextMatchNo();$("roundHeading").textContent=`第${selectedRound+1}ラウンド`;$("roundProgress").textContent=`${done} / 3`;
    const items=r.matches.map(([a,b],mi)=>{const no=selectedRound*3+mi+1,w=result(a,b),box=document.createElement("div");box.className=`match${no===next?" next":""}`;const num=document.createElement("div");num.className="match-no";num.innerHTML=`第${no}試合${no===next?"<small>NEXT</small>":""}`;box.append(num);
      const player=(idx,other)=>{const bt=document.createElement("button");bt.type="button";bt.className="player-button";if(w!==null)bt.classList.add(Number(w)===idx?"winner":"loser");bt.textContent=state.players[idx];bt.onclick=()=>setResult(idx,other,idx);return bt};box.append(player(a,b));const vs=document.createElement("span");vs.className="vs";vs.textContent="VS";box.append(vs);box.append(player(b,a));const clear=document.createElement("button");clear.type="button";clear.className="mini edit-only";clear.textContent="↺";clear.title="結果を取消";clear.onclick=()=>setResult(a,b,null);box.append(clear);return box});
    const bye=document.createElement("div");bye.className="bye";bye.textContent=`このラウンドの休み：${state.players[r.bye]}`;items.push(bye);$("roundBody").replaceChildren(...items)}
  function renderMatrix(){const table=$("matrix");table.replaceChildren();const head=document.createElement("thead"),hr=document.createElement("tr"),corner=document.createElement("th");corner.textContent="PLAYER";hr.append(corner);state.players.forEach(n=>{const th=document.createElement("th");th.textContent=n;th.title=n;hr.append(th)});head.append(hr);table.append(head);const body=document.createElement("tbody");state.players.forEach((name,i)=>{const tr=document.createElement("tr"),th=document.createElement("th");th.textContent=name;tr.append(th);state.players.forEach((_,j)=>{const td=document.createElement("td");if(i===j){td.className="self";td.textContent="—"}else{const w=result(i,j);if(w===null){td.className="pending";td.textContent="·"}else if(Number(w)===i){td.className="win";td.textContent="W"}else{td.className="loss";td.textContent="L"}}tr.append(td)});body.append(tr)});table.append(body)}
  function renderInputs(){$("eventTitleInput").value=state.title;$("playerInputs").replaceChildren(...state.players.map((n,i)=>{const input=document.createElement("input");input.className="text-input";input.maxLength=18;input.value=n;input.placeholder=`プレイヤー${i+1}`;input.setAttribute("aria-label",`参加者${i+1}`);return input}))}
  function render(){$("eventTitleDisplay").textContent=state.title;renderStandings();renderRounds();renderMatrix()}
  $("applyNamesButton").onclick=()=>{state.title=$("eventTitleInput").value.trim()||"ポケモン総当たり戦";state.players=[...$("playerInputs").querySelectorAll("input")].map((x,i)=>x.value.trim()||DEFAULT[i]);save();render()};
  $("tvButton").onclick=()=>{document.body.classList.toggle("tv-mode");$("tvButton").textContent=document.body.classList.contains("tv-mode")?"編集表示に戻る":"TV表示"};
  $("resetResultsButton").onclick=()=>{if(confirm("21試合の結果だけをリセットしますか？")){state.results={};save();render()}};$("resetAllButton").onclick=()=>{if(confirm("大会名・参加者名・全試合結果を初期化しますか？")){state=initial();save();renderInputs();render()}};
  $("backupButton").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`pokemon-round-robin-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)};
  $("importButton").onclick=()=>$("importFile").click();$("importFile").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!Array.isArray(p.players)||p.players.length!==7||typeof p.results!=="object")throw 0;state={title:String(p.title||"ポケモン総当たり戦"),players:p.players.map(String),results:p.results||{}};save();renderInputs();render()}catch{alert("このバックアップは読み込めませんでした。")}e.target.value=""};
  renderInputs();render();
})();
</script>
</body>
</html>
