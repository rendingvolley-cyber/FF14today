<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ポケモン総当たり戦</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b16;
      --panel: #10182b;
      --panel-2: #151f36;
      --line: #2b3b61;
      --text: #f8fafc;
      --muted: #9fb0cf;
      --accent: #ffd84d;
      --accent-2: #5ed7ff;
      --win: #63e6a6;
      --loss: #ff7c90;
      --draw: #c6b7ff;
      --radius: 18px;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans JP", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(94,215,255,.12), transparent 28rem),
        radial-gradient(circle at 88% 8%, rgba(255,216,77,.11), transparent 24rem),
        var(--bg);
    }
    button, input { font: inherit; }
    button { touch-action: manipulation; }
    .app { width: min(1540px, 100%); margin: 0 auto; padding: 22px 24px 48px; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between; gap: 18px;
      padding: 8px 0 18px; border-bottom: 1px solid rgba(159,176,207,.18);
    }
    .brand-row { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .ball {
      width: 48px; height: 48px; border-radius: 50%; flex: 0 0 auto;
      background: linear-gradient(#ff5167 0 46%, #f8fafc 46% 54%, #f8fafc 54%);
      border: 3px solid #0a0f1d; box-shadow: 0 0 0 1px #415274, 0 8px 22px rgba(0,0,0,.3);
      position: relative;
    }
    .ball::before { content: ""; position: absolute; left: 0; right: 0; top: 21px; height: 5px; background: #0a0f1d; }
    .ball::after { content: ""; position: absolute; width: 13px; height: 13px; border-radius: 50%; background: #f8fafc; border: 4px solid #0a0f1d; left: 50%; top: 50%; transform: translate(-50%,-50%); }
    .eyebrow { margin: 0 0 3px; font-size: 12px; letter-spacing: .16em; font-weight: 800; color: var(--accent-2); }
    h1 { margin: 0; font-size: clamp(25px, 3vw, 42px); line-height: 1.05; letter-spacing: -.035em; }
    .top-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
    .btn, .link-btn {
      border: 1px solid var(--line); background: rgba(21,31,54,.9); color: var(--text);
      border-radius: 999px; padding: 10px 14px; font-weight: 800; text-decoration: none; cursor: pointer;
    }
    .btn:hover, .link-btn:hover { border-color: #4a649a; background: #1a2845; }
    .btn-accent { background: var(--accent); color: #17140a; border-color: transparent; }
    .btn-danger { color: #ffd2da; }
    .hero {
      display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(480px, .95fr); gap: 16px;
      margin-top: 18px;
    }
    .panel {
      background: linear-gradient(180deg, rgba(21,31,54,.96), rgba(13,20,37,.96));
      border: 1px solid rgba(91,116,163,.4); border-radius: var(--radius);
      box-shadow: 0 18px 50px rgba(0,0,0,.18); overflow: hidden;
    }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 17px 18px 12px; }
    .panel-head h2 { margin: 0; font-size: 18px; letter-spacing: .02em; }
    .muted { color: var(--muted); }
    .progress { font-size: 13px; font-weight: 800; color: var(--muted); }
    .standings { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .standings th, .standings td { padding: 11px 16px; border-top: 1px solid rgba(77,101,145,.24); text-align: center; }
    .standings th { color: var(--muted); font-size: 12px; letter-spacing: .08em; font-weight: 800; }
    .standings th:nth-child(2), .standings td:nth-child(2) { text-align: left; }
    .standings td { font-size: clamp(15px, 1.8vw, 22px); font-weight: 760; }
    .rank { color: var(--accent); width: 56px; }
    .score { color: var(--accent-2); }
    .round-panel { display: flex; flex-direction: column; min-height: 100%; }
    .round-tabs { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding: 0 14px 13px; }
    .round-tab { border: 1px solid var(--line); background: #0d1528; color: var(--muted); border-radius: 11px; padding: 10px 4px; font-weight: 900; cursor: pointer; }
    .round-tab.active { background: var(--accent); color: #18140a; border-color: transparent; }
    .round-body { display: grid; gap: 9px; padding: 0 14px 14px; }
    .match {
      display: grid; grid-template-columns: minmax(0,1fr) 42px minmax(0,1fr) auto; gap: 8px; align-items: center;
      padding: 10px; border: 1px solid rgba(91,116,163,.34); border-radius: 14px; background: rgba(6,11,24,.52);
    }
    .player-button {
      min-width: 0; min-height: 48px; padding: 8px 10px; border-radius: 11px; border: 1px solid var(--line);
      color: var(--text); background: #16223c; font-weight: 850; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .player-button.winner { color: #071b12; background: var(--win); border-color: transparent; }
    .player-button.loser { color: #ffdce2; background: #3d1724; border-color: #753147; }
    .vs { text-align: center; color: var(--muted); font-weight: 900; font-size: 12px; }
    .match-extra { display: flex; gap: 5px; }
    .mini { border: 1px solid var(--line); background: #0e172a; color: var(--muted); border-radius: 9px; min-height: 42px; padding: 0 9px; font-weight: 800; cursor: pointer; }
    .mini.active-draw { color: #171126; background: var(--draw); border-color: transparent; }
    .bye { text-align: center; color: var(--muted); border: 1px dashed #324469; border-radius: 12px; padding: 8px 12px; font-size: 13px; }
    .section { margin-top: 16px; }
    .matrix-wrap { overflow-x: auto; padding: 0 14px 14px; }
    .matrix { border-collapse: separate; border-spacing: 5px; width: 100%; min-width: 800px; table-layout: fixed; }
    .matrix th { color: var(--muted); font-size: 12px; padding: 7px 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .matrix th:first-child { width: 150px; text-align: left; }
    .matrix td { text-align: center; height: 44px; border-radius: 9px; font-weight: 900; background: #0c1425; border: 1px solid rgba(77,101,145,.25); }
    .matrix td.self { color: #53617a; background: transparent; border-style: dashed; }
    .matrix td.win { color: #071b12; background: var(--win); border-color: transparent; }
    .matrix td.loss { color: #ffe0e5; background: #552033; border-color: #783248; }
    .matrix td.draw { color: #1b1231; background: var(--draw); border-color: transparent; }
    .matrix td.pending { color: #667797; }
    details.setup { margin-top: 16px; }
    details.setup > summary { list-style: none; cursor: pointer; padding: 14px 18px; font-weight: 850; display: flex; justify-content: space-between; align-items: center; }
    details.setup > summary::-webkit-details-marker { display: none; }
    .setup-body { padding: 0 18px 18px; border-top: 1px solid rgba(77,101,145,.24); }
    .field-label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 12px; font-weight: 850; letter-spacing: .06em; }
    .text-input { width: 100%; min-height: 46px; background: #0a1223; color: var(--text); border: 1px solid var(--line); border-radius: 11px; padding: 9px 11px; }
    .player-inputs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .setup-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .footer-note { margin: 16px 2px 0; color: #7f91b2; font-size: 12px; }
    .tv-only { display: none; }
    body.tv-mode .edit-only, body.tv-mode details.setup, body.tv-mode .top-actions .backup, body.tv-mode .matrix-panel { display: none !important; }
    body.tv-mode .tv-only { display: inline; }
    body.tv-mode .app { width: min(1700px, 100%); padding: 22px 28px 28px; }
    body.tv-mode .hero { grid-template-columns: .9fr 1.1fr; }
    body.tv-mode .panel-head h2 { font-size: clamp(20px, 2vw, 30px); }
    body.tv-mode .standings td { padding-top: 14px; padding-bottom: 14px; font-size: clamp(19px, 2.4vw, 32px); }
    body.tv-mode .round-body { gap: 12px; }
    body.tv-mode .match { grid-template-columns: minmax(0,1fr) 52px minmax(0,1fr); padding: 14px; }
    body.tv-mode .match-extra { display: none; }
    body.tv-mode .player-button { pointer-events: none; min-height: 60px; font-size: clamp(18px, 2vw, 28px); }
    body.tv-mode .round-tabs { gap: 8px; }
    body.tv-mode .round-tab { padding: 12px 5px; font-size: 17px; }
    @media (max-width: 980px) {
      .app { padding: 16px 14px 36px; }
      .hero { grid-template-columns: 1fr; }
      .player-inputs { grid-template-columns: repeat(2, 1fr); }
      .topbar { align-items: flex-start; }
    }
    @media (max-width: 620px) {
      .topbar { flex-direction: column; }
      .top-actions { width: 100%; justify-content: flex-start; }
      .round-tabs { grid-template-columns: repeat(4,1fr); }
      .match { grid-template-columns: minmax(0,1fr) 34px minmax(0,1fr); }
      .match-extra { grid-column: 1 / -1; justify-content: center; }
      .standings th, .standings td { padding-left: 8px; padding-right: 8px; }
      .standings th:nth-child(5), .standings td:nth-child(5) { display: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-row">
        <span class="ball" aria-hidden="true"></span>
        <div>
          <p class="eyebrow">ROUND ROBIN SCOREBOARD</p>
          <h1 id="eventTitleDisplay">ポケモン総当たり戦</h1>
        </div>
      </div>
      <div class="top-actions">
        <button id="tvButton" class="btn btn-accent" type="button">TV表示</button>
        <button id="backupButton" class="btn backup edit-only" type="button">バックアップ</button>
        <a class="link-btn" href="/">FF14 Todayへ</a>
      </div>
    </header>

    <section class="hero" aria-label="大会状況">
      <article class="panel standings-panel">
        <div class="panel-head">
          <h2>順位表</h2>
          <span id="overallProgress" class="progress">0 / 21 試合</span>
        </div>
        <table class="standings">
          <thead><tr><th>順位</th><th>プレイヤー</th><th>勝</th><th>敗</th><th>分</th><th>pt</th></tr></thead>
          <tbody id="standingsBody"></tbody>
        </table>
      </article>

      <article class="panel round-panel">
        <div class="panel-head">
          <h2 id="roundHeading">第1ラウンド</h2>
          <span id="roundProgress" class="progress">0 / 3</span>
        </div>
        <div id="roundTabs" class="round-tabs" aria-label="ラウンド選択"></div>
        <div id="roundBody" class="round-body"></div>
      </article>
    </section>

    <section class="section panel matrix-panel">
      <div class="panel-head">
        <h2>総当たり表</h2>
        <span class="progress">W 勝ち / L 負け / D 引分</span>
      </div>
      <div class="matrix-wrap"><table id="matrix" class="matrix"></table></div>
    </section>

    <details id="setupPanel" class="section panel setup edit-only">
      <summary><span>大会設定・参加者名</span><span class="muted">タップして編集</span></summary>
      <div class="setup-body">
        <label class="field-label" for="eventTitleInput">大会名</label>
        <input id="eventTitleInput" class="text-input" maxlength="40" value="ポケモン総当たり戦">
        <span class="field-label">参加者（7人）</span>
        <div id="playerInputs" class="player-inputs"></div>
        <div class="setup-actions">
          <button id="applyNamesButton" class="btn btn-accent" type="button">名前を反映</button>
          <button id="importButton" class="btn" type="button">バックアップ読込</button>
          <button id="resetResultsButton" class="btn btn-danger" type="button">結果だけリセット</button>
          <button id="resetAllButton" class="btn btn-danger" type="button">全データ初期化</button>
          <input id="importFile" type="file" accept="application/json" hidden>
        </div>
      </div>
    </details>

    <p class="footer-note edit-only">結果はこのiPadのブラウザに自動保存されます。イベント前に「バックアップ」を1回押しておくと安心です。</p>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = "pokemon-round-robin-v1";
      const DEFAULT_PLAYERS = ["プレイヤー1", "プレイヤー2", "プレイヤー3", "プレイヤー4", "プレイヤー5", "プレイヤー6", "プレイヤー7"];
      const $ = (id) => document.getElementById(id);
      let selectedRound = 0;

      function defaultState() {
        return { title: "ポケモン総当たり戦", players: [...DEFAULT_PLAYERS], results: {} };
      }

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return defaultState();
          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed.players) || parsed.players.length !== 7 || typeof parsed.results !== "object") return defaultState();
          return { title: String(parsed.title || "ポケモン総当たり戦"), players: parsed.players.map((v, i) => String(v || DEFAULT_PLAYERS[i])).slice(0, 7), results: parsed.results || {} };
        } catch { return defaultState(); }
      }

      let state = loadState();
      const save = () => localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      const matchKey = (a, b) => [a, b].sort((x, y) => x - y).join("-");

      function makeRounds(count) {
        const ghost = count;
        const list = Array.from({ length: count }, (_, i) => i);
        list.push(ghost);
        const rounds = [];
        for (let r = 0; r < list.length - 1; r += 1) {
          const matches = [];
          let bye = null;
          for (let i = 0; i < list.length / 2; i += 1) {
            const a = list[i];
            const b = list[list.length - 1 - i];
            if (a === ghost) bye = b;
            else if (b === ghost) bye = a;
            else matches.push(r % 2 === 0 ? [a, b] : [b, a]);
          }
          rounds.push({ matches, bye });
          list.splice(1, 0, list.pop());
        }
        return rounds;
      }

      const rounds = makeRounds(7);

      function setResult(a, b, value) {
        const key = matchKey(a, b);
        if (!value) delete state.results[key]; else state.results[key] = value;
        save(); render();
      }

      function resultFor(a, b) { return state.results[matchKey(a, b)] || null; }

      function stats() {
        const rows = state.players.map((name, index) => ({ index, name, w: 0, l: 0, d: 0, pts: 0, played: 0 }));
        for (const round of rounds) {
          for (const [a, b] of round.matches) {
            const result = resultFor(a, b);
            if (!result) continue;
            rows[a].played += 1; rows[b].played += 1;
            if (result === "draw") { rows[a].d += 1; rows[b].d += 1; rows[a].pts += 1; rows[b].pts += 1; }
            else if (Number(result) === a) { rows[a].w += 1; rows[b].l += 1; rows[a].pts += 3; }
            else if (Number(result) === b) { rows[b].w += 1; rows[a].l += 1; rows[b].pts += 3; }
          }
        }
        rows.sort((x, y) => y.pts - x.pts || y.w - x.w || x.l - y.l || x.index - y.index);
        let lastSig = null; let lastRank = 0;
        rows.forEach((row, i) => {
          const sig = `${row.pts}/${row.w}/${row.l}`;
          if (sig !== lastSig) lastRank = i + 1;
          row.rank = lastRank; lastSig = sig;
        });
        return rows;
      }

      function renderStandings() {
        const rows = stats();
        const body = $("standingsBody");
        body.replaceChildren(...rows.map((row) => {
          const tr = document.createElement("tr");
          const values = [row.rank, row.name, row.w, row.l, row.d, row.pts];
          values.forEach((value, i) => {
            const td = document.createElement("td"); td.textContent = value;
            if (i === 0) td.className = "rank"; if (i === 5) td.className = "score";
            tr.appendChild(td);
          });
          return tr;
        }));
        const done = Object.keys(state.results).length;
        $("overallProgress").textContent = `${done} / 21 試合`;
      }

      function renderRounds() {
        const tabs = $("roundTabs");
        tabs.replaceChildren(...rounds.map((round, i) => {
          const done = round.matches.filter(([a,b]) => resultFor(a,b)).length;
          const button = document.createElement("button");
          button.type = "button"; button.className = `round-tab${i === selectedRound ? " active" : ""}`;
          button.textContent = `${i + 1}${done === 3 ? " ✓" : ""}`;
          button.addEventListener("click", () => { selectedRound = i; renderRounds(); });
          return button;
        }));

        const round = rounds[selectedRound];
        $("roundHeading").textContent = `第${selectedRound + 1}ラウンド`;
        const done = round.matches.filter(([a,b]) => resultFor(a,b)).length;
        $("roundProgress").textContent = `${done} / 3`;
        const items = [];
        round.matches.forEach(([a, b]) => {
          const result = resultFor(a, b);
          const box = document.createElement("div"); box.className = "match";
          const makePlayer = (idx, other) => {
            const button = document.createElement("button"); button.type = "button"; button.className = "player-button";
            if (result && result !== "draw") button.classList.add(Number(result) === idx ? "winner" : "loser");
            button.textContent = state.players[idx];
            button.addEventListener("click", () => setResult(idx, other, String(idx)));
            return button;
          };
          box.append(makePlayer(a, b));
          const vs = document.createElement("span"); vs.className = "vs"; vs.textContent = "VS"; box.append(vs);
          box.append(makePlayer(b, a));
          const extra = document.createElement("div"); extra.className = "match-extra edit-only";
          const draw = document.createElement("button"); draw.type = "button"; draw.className = `mini${result === "draw" ? " active-draw" : ""}`; draw.textContent = "引分"; draw.addEventListener("click", () => setResult(a,b,"draw"));
          const clear = document.createElement("button"); clear.type = "button"; clear.className = "mini"; clear.textContent = "↺"; clear.title = "結果を取消"; clear.addEventListener("click", () => setResult(a,b,null));
          extra.append(draw, clear); box.append(extra); items.push(box);
        });
        const bye = document.createElement("div"); bye.className = "bye"; bye.textContent = `休み：${state.players[round.bye]}`; items.push(bye);
        $("roundBody").replaceChildren(...items);
      }

      function renderMatrix() {
        const table = $("matrix"); table.replaceChildren();
        const head = document.createElement("thead"); const hr = document.createElement("tr");
        const corner = document.createElement("th"); corner.textContent = "PLAYER"; hr.append(corner);
        state.players.forEach((name) => { const th = document.createElement("th"); th.textContent = name; th.title = name; hr.append(th); });
        head.append(hr); table.append(head);
        const body = document.createElement("tbody");
        state.players.forEach((name, i) => {
          const tr = document.createElement("tr"); const th = document.createElement("th"); th.textContent = name; th.title = name; tr.append(th);
          state.players.forEach((_, j) => {
            const td = document.createElement("td");
            if (i === j) { td.className = "self"; td.textContent = "—"; }
            else {
              const result = resultFor(i, j);
              if (!result) { td.className = "pending"; td.textContent = "·"; }
              else if (result === "draw") { td.className = "draw"; td.textContent = "D"; }
              else if (Number(result) === i) { td.className = "win"; td.textContent = "W"; }
              else { td.className = "loss"; td.textContent = "L"; }
            }
            tr.append(td);
          });
          body.append(tr);
        });
        table.append(body);
      }

      function renderInputs() {
        $("eventTitleInput").value = state.title;
        const wrap = $("playerInputs");
        wrap.replaceChildren(...state.players.map((name, i) => {
          const input = document.createElement("input"); input.className = "text-input"; input.maxLength = 18; input.value = name; input.placeholder = `プレイヤー${i + 1}`; input.dataset.playerIndex = i; input.setAttribute("aria-label", `参加者${i + 1}`); return input;
        }));
      }

      function render() {
        $("eventTitleDisplay").textContent = state.title;
        renderStandings(); renderRounds(); renderMatrix();
      }

      $("applyNamesButton").addEventListener("click", () => {
        state.title = $("eventTitleInput").value.trim() || "ポケモン総当たり戦";
        state.players = [...$("playerInputs").querySelectorAll("input")].map((input, i) => input.value.trim() || DEFAULT_PLAYERS[i]);
        save(); render();
      });

      $("tvButton").addEventListener("click", () => {
        document.body.classList.toggle("tv-mode");
        $("tvButton").textContent = document.body.classList.contains("tv-mode") ? "編集表示に戻る" : "TV表示";
      });

      $("resetResultsButton").addEventListener("click", () => {
        if (!confirm("21試合の結果だけをリセットしますか？参加者名は残ります。")) return;
        state.results = {}; save(); render();
      });

      $("resetAllButton").addEventListener("click", () => {
        if (!confirm("大会名・参加者名・全試合結果を初期化しますか？")) return;
        state = defaultState(); save(); renderInputs(); render();
      });

      $("backupButton").addEventListener("click", () => {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob); const a = document.createElement("a");
        a.href = url; a.download = `pokemon-round-robin-${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
      });

      $("importButton").addEventListener("click", () => $("importFile").click());
      $("importFile").addEventListener("change", async (event) => {
        const file = event.target.files && event.target.files[0]; if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          if (!Array.isArray(parsed.players) || parsed.players.length !== 7 || typeof parsed.results !== "object") throw new Error("invalid");
          state = { title: String(parsed.title || "ポケモン総当たり戦"), players: parsed.players.map(String), results: parsed.results || {} };
          save(); renderInputs(); render();
        } catch { alert("このバックアップは読み込めませんでした。"); }
        event.target.value = "";
      });

      renderInputs(); render();
    })();
  </script>
</body>
</html>
