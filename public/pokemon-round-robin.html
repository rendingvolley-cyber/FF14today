<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ポケモン総当たり戦</title>
  <style>
    :root{color-scheme:dark;--bg:#070b16;--panel:#10182b;--line:#2b3b61;--text:#f8fafc;--muted:#9fb0cf;--accent:#ffd84d;--accent2:#5ed7ff;--win:#63e6a6;--loss:#ff7c90}
    *{box-sizing:border-box}html{min-height:100%;background:var(--bg)}body{margin:0;min-height:100vh;font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--text);background:radial-gradient(circle at 12% 0%,rgba(94,215,255,.12),transparent 28rem),radial-gradient(circle at 88% 8%,rgba(255,216,77,.11),transparent 24rem),var(--bg)}
    button,input,select{font:inherit}button{touch-action:manipulation}.app{width:min(1540px,100%);margin:0 auto;padding:22px 24px 48px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:8px 0 18px;border-bottom:1px solid rgba(159,176,207,.18)}.brand-row{display:flex;align-items:center;gap:14px;min-width:0}
    .ball{width:48px;height:48px;border-radius:50%;flex:0 0 auto;background:linear-gradient(#ff5167 0 46%,#f8fafc 46% 54%,#f8fafc 54%);border:3px solid #0a0f1d;box-shadow:0 0 0 1px #415274,0 8px 22px rgba(0,0,0,.3);position:relative}.ball:before{content:"";position:absolute;left:0;right:0;top:21px;height:5px;background:#0a0f1d}.ball:after{content:"";position:absolute;width:13px;height:13px;border-radius:50%;background:#f8fafc;border:4px solid #0a0f1d;left:50%;top:50%;transform:translate(-50%,-50%)}
    .eyebrow{margin:0 0 3px;font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--accent2)}h1{margin:0;font-size:clamp(25px,3vw,42px);line-height:1.05;letter-spacing:-.035em}.top-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}.btn,.link-btn{border:1px solid var(--line);background:rgba(21,31,54,.9);color:var(--text);border-radius:999px;padding:10px 14px;font-weight:800;text-decoration:none;cursor:pointer}.btn-accent{background:var(--accent);color:#17140a;border-color:transparent}.btn-danger{color:#ffd2da}
    .hero{display:grid;grid-template-columns:minmax(0,.9fr) minmax(520px,1.1fr);gap:16px;margin-top:18px}.panel{background:linear-gradient(180deg,rgba(21,31,54,.96),rgba(13,20,37,.96));border:1px solid rgba(91,116,163,.4);border-radius:18px;box-shadow:0 18px 50px rgba(0,0,0,.18);overflow:hidden}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:17px 18px 12px}.panel-head h2{margin:0;font-size:18px}.progress{font-size:13px;font-weight:800;color:var(--muted)}.muted{color:var(--muted)}
    .rule-note{margin:0;padding:0 18px 12px;color:var(--muted);font-size:12px}.standings{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.standings th,.standings td{padding:12px 16px;border-top:1px solid rgba(77,101,145,.24);text-align:center}.standings th{color:var(--muted);font-size:12px;letter-spacing:.08em}.standings th:nth-child(2),.standings td:nth-child(2){text-align:left}.standings td{font-size:clamp(16px,1.8vw,23px);font-weight:780}.rank{color:var(--accent);width:56px}.wins{color:var(--accent2)}
    .round-tabs{display:flex;gap:6px;padding:0 14px 13px;overflow-x:auto}.round-tab{min-width:48px;border:1px solid var(--line);background:#0d1528;color:var(--muted);border-radius:11px;padding:10px 8px;font-weight:900;cursor:pointer}.round-tab.active{background:var(--accent);color:#18140a;border-color:transparent}.round-body{display:grid;gap:9px;padding:0 14px 14px}.match{display:grid;grid-template-columns:76px minmax(0,1fr) 42px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;border:1px solid rgba(91,116,163,.34);border-radius:14px;background:rgba(6,11,24,.52)}.match.next{border-color:var(--accent);box-shadow:0 0 0 1px rgba(255,216,77,.3) inset}.match-no{font-size:12px;font-weight:900;color:var(--accent);text-align:center}.match-no small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.player-button{min-width:0;min-height:48px;padding:8px 10px;border-radius:11px;border:1px solid var(--line);color:var(--text);background:#16223c;font-weight:850;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.player-button.winner{color:#071b12;background:var(--win);border-color:transparent}.player-button.loser{color:#ffdce2;background:#3d1724;border-color:#753147}.vs{text-align:center;color:var(--muted);font-weight:900;font-size:12px}.mini{border:1px solid var(--line);background:#0e172a;color:var(--muted);border-radius:9px;min-height:42px;padding:0 10px;font-weight:800;cursor:pointer}.bye{text-align:center;color:var(--muted);border:1px dashed #324469;border-radius:12px;padding:8px 12px;font-size:13px}
    .section{margin-top:16px}.matrix-wrap{overflow-x:auto;padding:0 14px 14px}.matrix{border-collapse:separate;border-spacing:5px;width:100%;min-width:760px;table-layout:fixed}.matrix th{color:var(--muted);font-size:12px;padding:7px 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.matrix th:first-child{width:150px;text-align:left}.matrix td{text-align:center;height:44px;border-radius:9px;font-weight:900;background:#0c1425;border:1px solid rgba(77,101,145,.25)}.matrix td.self{color:#53617a;background:transparent;border-style:dashed}.matrix td.win{color:#071b12;background:var(--win);border-color:transparent}.matrix td.loss{color:#ffe0e5;background:#552033;border-color:#783248}.matrix td.pending{color:#667797}
    details.setup>summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:850;display:flex;justify-content:space-between;align-items:center}details.setup>summary::-webkit-details-marker{display:none}.setup-body{padding:0 18px 18px;border-top:1px solid rgba(77,101,145,.24)}.setup-grid{display:grid;grid-template-columns:minmax(180px,.35fr) minmax(260px,1fr);gap:12px}.field-label{display:block;margin:14px 0 6px;color:var(--muted);font-size:12px;font-weight:850;letter-spacing:.06em}.text-input,.select-input{width:100%;min-height:46px;background:#0a1223;color:var(--text);border:1px solid var(--line);border-radius:11px;padding:9px 11px}.player-inputs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.setup-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.footer-note{margin:16px 2px 0;color:#7f91b2;font-size:12px}
    body.tv-mode .edit-only,body.tv-mode details.setup,body.tv-mode .matrix-panel{display:none!important}body.tv-mode .app{width:min(1700px,100%);padding:22px 28px 28px}body.tv-mode .hero{grid-template-columns:.82fr 1.18fr}body.tv-mode .panel-head h2{font-size:clamp(20px,2vw,30px)}body.tv-mode .standings td{padding-top:14px;padding-bottom:14px;font-size:clamp(19px,2.4vw,32px)}body.tv-mode .match{grid-template-columns:92px minmax(0,1fr) 52px minmax(0,1fr);padding:14px}body.tv-mode .match .mini{display:none}body.tv-mode .player-button{pointer-events:none;min-height:60px;font-size:clamp(18px,2vw,28px)}body.tv-mode .match-no{font-size:16px}body.tv-mode .round-tab{padding:12px 9px;font-size:17px}
    @media(max-width:980px){.app{padding:16px 14px 36px}.hero{grid-template-columns:1fr}.player-inputs{grid-template-columns:repeat(2,1fr)}.topbar{align-items:flex-start}.setup-grid{grid-template-columns:1fr}}@media(max-width:650px){.topbar{flex-direction:column}.top-actions{width:100%;justify-content:flex-start}.match{grid-template-columns:58px minmax(0,1fr) 30px minmax(0,1fr)}.match .mini{grid-column:1/-1;justify-self:center}.standings th,.standings td{padding-left:8px;padding-right:8px}}
  </style>
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand-row"><span class="ball" aria-hidden="true"></span><div><p class="eyebrow">ROUND ROBIN SCOREBOARD</p><h1 id="eventTitleDisplay">ポケモン総当たり戦</h1></div></div>
    <div class="top-actions"><button id="tvButton" class="btn btn-accent" type="button">TV表示</button><button id="backupButton" class="btn edit-only" type="button">バックアップ</button><a class="link-btn" href="/">FF14 Todayへ</a></div>
  </header>

  <section class="hero" aria-label="大会状況">
    <article class="panel">
      <div class="panel-head"><h2>順位表</h2><span id="overallProgress" class="progress"></span></div>
      <p class="rule-note">順位：勝数 → 同勝数内の直接対決。直接対決でも並ぶ場合は同順位。</p>
      <table class="standings"><thead><tr><th>順位</th><th>プレイヤー</th><th>勝</th><th>敗</th></tr></thead><tbody id="standingsBody"></tbody></table>
    </article>
    <article class="panel">
      <div class="panel-head"><h2 id="roundHeading"></h2><span id="roundProgress" class="progress"></span></div>
      <div id="roundTabs" class="round-tabs"></div><div id="roundBody" class="round-body"></div>
    </article>
  </section>

  <section class="section panel matrix-panel"><div class="panel-head"><h2>総当たり表</h2><span class="progress">W 勝ち / L 負け</span></div><div class="matrix-wrap"><table id="matrix" class="matrix"></table></div></section>

  <details class="section panel setup edit-only"><summary><span>大会設定・参加者</span><span class="muted">タップして編集</span></summary><div class="setup-body">
    <div class="setup-grid">
      <div><label class="field-label" for="playerCount">参加人数</label><select id="playerCount" class="select-input"></select></div>
      <div><label class="field-label" for="eventTitleInput">大会名</label><input id="eventTitleInput" class="text-input" maxlength="40" value="ポケモン総当たり戦"></div>
    </div>
    <span class="field-label">参加者名</span><div id="playerInputs" class="player-inputs"></div>
    <div class="setup-actions"><button id="applyNamesButton" class="btn btn-accent" type="button">設定を反映</button><button id="importButton" class="btn" type="button">バックアップ読込</button><button id="resetResultsButton" class="btn btn-danger" type="button">結果だけリセット</button><button id="resetAllButton" class="btn btn-danger" type="button">全データ初期化</button><input id="importFile" type="file" accept="application/json" hidden></div>
  </div></details>
  <p class="footer-note edit-only">3〜12人対応。人数変更時だけ対戦表と結果を作り直します。黄色枠が次の対戦です。</p>
</main>
<script>
(()=>{
  const KEY="pokemon-round-robin-v3",OLD_KEY="pokemon-round-robin-v2",MIN=3,MAX=12;
  const $=id=>document.getElementById(id);
  const defaultNames=n=>Array.from({length:n},(_,i)=>`プレイヤー${i+1}`);
  const initial=()=>({title:"ポケモン総当たり戦",players:defaultNames(7),results:{}});
  let selectedRound=0;

  function validState(p){return p&&Array.isArray(p.players)&&p.players.length>=MIN&&p.players.length<=MAX&&typeof p.results==="object"&&p.results!==null}
  function load(){try{let p=JSON.parse(localStorage.getItem(KEY)||"null");if(!validState(p))p=JSON.parse(localStorage.getItem(OLD_KEY)||"null");if(!validState(p))return initial();return{title:String(p.title||"ポケモン総当たり戦"),players:p.players.map((v,i)=>String(v||`プレイヤー${i+1}`)),results:p.results||{}}}catch{return initial()}}
  let state=load();
  const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
  const matchKey=(a,b)=>[a,b].sort((x,y)=>x-y).join("-");
  const result=(a,b)=>state.results[matchKey(a,b)]??null;

  function makeRounds(n){
    const hasBye=n%2===1,ghost=hasBye?n:null,list=Array.from({length:n},(_,i)=>i);if(hasBye)list.push(ghost);
    const rounds=[];
    for(let r=0;r<list.length-1;r++){
      const matches=[];let bye=null;
      for(let i=0;i<list.length/2;i++){
        const a=list[i],b=list[list.length-1-i];
        if(a===ghost)bye=b;else if(b===ghost)bye=a;else matches.push(r%2===0?[a,b]:[b,a]);
      }
      rounds.push({matches,bye});list.splice(1,0,list.pop());
    }
    return rounds;
  }

  function schedule(){
    const rounds=makeRounds(state.players.length);let no=1;const flat=[];
    rounds.forEach((round,ri)=>round.matches.forEach((m,mi)=>flat.push({round:ri,index:mi,no:no++,a:m[0],b:m[1]})));
    return{rounds,flat,total:state.players.length*(state.players.length-1)/2};
  }

  function setResult(a,b,winner){if(winner===null)delete state.results[matchKey(a,b)];else state.results[matchKey(a,b)]=String(winner);save();render()}

  function standings(){
    const {flat}=schedule();
    const rows=state.players.map((name,index)=>({index,name,w:0,l:0,rank:0,h2h:0}));
    flat.forEach(m=>{const w=result(m.a,m.b);if(w===null)return;const wi=Number(w);if(wi!==m.a&&wi!==m.b)return;const li=wi===m.a?m.b:m.a;rows[wi].w++;rows[li].l++});
    const byWins=new Map();rows.forEach(row=>{if(!byWins.has(row.w))byWins.set(row.w,[]);byWins.get(row.w).push(row)});
    const ordered=[];let position=1;
    [...byWins.keys()].sort((a,b)=>b-a).forEach(wins=>{
      const group=byWins.get(wins);
      group.forEach(row=>{row.h2h=0});
      for(let i=0;i<group.length;i++)for(let j=i+1;j<group.length;j++){
        const r=result(group[i].index,group[j].index);if(r!==null){const winner=Number(r);const target=group.find(x=>x.index===winner);if(target)target.h2h++}
      }
      const h2hGroups=new Map();group.forEach(row=>{if(!h2hGroups.has(row.h2h))h2hGroups.set(row.h2h,[]);h2hGroups.get(row.h2h).push(row)});
      [...h2hGroups.keys()].sort((a,b)=>b-a).forEach(score=>{
        const tied=h2hGroups.get(score).sort((a,b)=>a.index-b.index);tied.forEach(row=>{row.rank=position;ordered.push(row)});position+=tied.length;
      });
    });
    return ordered;
  }

  function renderStandings(){
    const body=$("standingsBody");body.replaceChildren(...standings().map(row=>{const tr=document.createElement("tr");[row.rank,row.name,row.w,row.l].forEach((v,i)=>{const td=document.createElement("td");td.textContent=v;if(i===0)td.className="rank";if(i===2)td.className="wins";tr.append(td)});return tr}));
    const s=schedule(),done=s.flat.filter(m=>result(m.a,m.b)!==null).length;$("overallProgress").textContent=`${done} / ${s.total} 試合`;
  }

  function renderRounds(){
    const s=schedule();if(selectedRound>=s.rounds.length)selectedRound=0;
    const next=s.flat.find(m=>result(m.a,m.b)===null);
    $("roundTabs").replaceChildren(...s.rounds.map((round,i)=>{const b=document.createElement("button");b.type="button";b.className=`round-tab${i===selectedRound?" active":""}`;const done=round.matches.filter(([a,b])=>result(a,b)!==null).length;b.textContent=`${i+1}${done===round.matches.length?" ✓":""}`;b.onclick=()=>{selectedRound=i;renderRounds()};return b}));
    const round=s.rounds[selectedRound],done=round.matches.filter(([a,b])=>result(a,b)!==null).length;$("roundHeading").textContent=`第${selectedRound+1}ラウンド`;$("roundProgress").textContent=`${done} / ${round.matches.length}`;
    const items=[];
    round.matches.forEach(([a,b],mi)=>{
      const meta=s.flat.find(m=>m.round===selectedRound&&m.index===mi),r=result(a,b),box=document.createElement("div");box.className=`match${next&&next.no===meta.no?" next":""}`;
      const no=document.createElement("div");no.className="match-no";no.innerHTML=`第${meta.no}試合${next&&next.no===meta.no?"<small>NEXT</small>":""}`;box.append(no);
      const player=(idx,other)=>{const btn=document.createElement("button");btn.type="button";btn.className="player-button";btn.textContent=state.players[idx];if(r!==null)btn.classList.add(Number(r)===idx?"winner":"loser");btn.onclick=()=>setResult(idx,other,idx);return btn};
      box.append(player(a,b));const vs=document.createElement("span");vs.className="vs";vs.textContent="VS";box.append(vs);box.append(player(b,a));const clear=document.createElement("button");clear.type="button";clear.className="mini edit-only";clear.textContent="取消";clear.onclick=()=>setResult(a,b,null);box.append(clear);items.push(box);
    });
    if(round.bye!==null){const bye=document.createElement("div");bye.className="bye";bye.textContent=`休み：${state.players[round.bye]}`;items.push(bye)}
    $("roundBody").replaceChildren(...items);
  }

  function renderMatrix(){
    const table=$("matrix");table.replaceChildren();const thead=document.createElement("thead"),hr=document.createElement("tr"),corner=document.createElement("th");corner.textContent="PLAYER";hr.append(corner);state.players.forEach(name=>{const th=document.createElement("th");th.textContent=name;th.title=name;hr.append(th)});thead.append(hr);table.append(thead);
    const tbody=document.createElement("tbody");state.players.forEach((name,i)=>{const tr=document.createElement("tr"),th=document.createElement("th");th.textContent=name;tr.append(th);state.players.forEach((_,j)=>{const td=document.createElement("td");if(i===j){td.className="self";td.textContent="—"}else{const r=result(i,j);if(r===null){td.className="pending";td.textContent="·"}else if(Number(r)===i){td.className="win";td.textContent="W"}else{td.className="loss";td.textContent="L"}}tr.append(td)});tbody.append(tr)});table.append(tbody);
  }

  function currentDraftNames(){return [...$("playerInputs").querySelectorAll("input")].map((input,i)=>input.value.trim()||`プレイヤー${i+1}`)}
  function renderPlayerInputs(count,names=state.players){const arr=Array.from({length:count},(_,i)=>names[i]||`プレイヤー${i+1}`);$("playerInputs").replaceChildren(...arr.map((name,i)=>{const input=document.createElement("input");input.className="text-input";input.maxLength=18;input.value=name;input.placeholder=`プレイヤー${i+1}`;input.setAttribute("aria-label",`参加者${i+1}`);return input}))}
  function renderSetup(){$("eventTitleInput").value=state.title;$("playerCount").value=String(state.players.length);renderPlayerInputs(state.players.length)}
  function render(){$("eventTitleDisplay").textContent=state.title;renderStandings();renderRounds();renderMatrix()}

  for(let n=MIN;n<=MAX;n++){const o=document.createElement("option");o.value=String(n);o.textContent=`${n}人`;$("playerCount").append(o)}
  $("playerCount").onchange=()=>{const names=currentDraftNames(),count=Number($("playerCount").value);renderPlayerInputs(count,names)};
  $("applyNamesButton").onclick=()=>{const count=Number($("playerCount").value),changed=count!==state.players.length;if(changed&&Object.keys(state.results).length&& !confirm("参加人数を変更すると、現在の対戦結果をリセットします。続けますか？")){renderSetup();return}state.title=$("eventTitleInput").value.trim()||"ポケモン総当たり戦";state.players=currentDraftNames().slice(0,count);if(changed){state.results={};selectedRound=0}save();render()};
  $("tvButton").onclick=()=>{document.body.classList.toggle("tv-mode");$("tvButton").textContent=document.body.classList.contains("tv-mode")?"編集表示に戻る":"TV表示"};
  $("resetResultsButton").onclick=()=>{if(confirm("全試合の結果をリセットしますか？")){state.results={};selectedRound=0;save();render()}};
  $("resetAllButton").onclick=()=>{if(confirm("大会名・参加者・全結果を初期化しますか？")){state=initial();selectedRound=0;save();renderSetup();render()}};
  $("backupButton").onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`pokemon-round-robin-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)};
  $("importButton").onclick=()=>$("importFile").click();
  $("importFile").onchange=async e=>{const file=e.target.files&&e.target.files[0];if(!file)return;try{const p=JSON.parse(await file.text());if(!validState(p))throw new Error("invalid");state={title:String(p.title||"ポケモン総当たり戦"),players:p.players.map(String),results:p.results||{}};selectedRound=0;save();renderSetup();render()}catch{alert("このバックアップは読み込めませんでした。3〜12人の大会データを選んでください。")}e.target.value=""};

  save();renderSetup();render();
})();
</script>
</body>
</html>
