<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <title>ポケモン総当たり戦</title>
  <link rel="stylesheet" href="/pokemon-round-robin.css?v=10">
</head>
<body>
<main class="app">
  <header class="topbar">
    <div class="brand"><span class="ball" aria-hidden="true"></span><div><p class="eyebrow">ROUND ROBIN SCOREBOARD</p><h1 id="eventTitle">ポケモン総当たり戦</h1></div></div>
    <div class="actions"><button id="backupButton" class="btn">バックアップ</button><a class="link" href="/">FF14 Todayへ</a></div>
  </header>

  <section class="dashboard">
    <article class="panel standings-panel">
      <div class="head"><h2>順位</h2><span id="progress" class="progress"></span></div>
      <table class="standings"><thead><tr><th>位</th><th>プレイヤー</th><th>勝</th><th>敗</th></tr></thead><tbody id="standings"></tbody></table>
    </article>

    <article class="panel suggest-panel">
      <div class="head"><h2>次にできる対戦</h2><span class="progress">空き組を提案</span></div>
      <div class="suggest-body">
        <p class="rule">候補の名前か「開始」をタップ → 対戦中。対戦中は勝者名をタップして結果確定。</p>
        <div id="playingSummary" class="playing-summary"></div>
        <div id="recommended" class="cards"></div>
      </div>
    </article>

    <article class="panel matrix-panel">
      <div class="head"><h2>総当たり表</h2><span class="progress">W / L / ●対戦中 ・ W/Lタップで修正</span></div>
      <div class="matrix-wrap"><table id="matrix" class="matrix"></table></div>
    </article>
  </section>

  <details class="allmatches">
    <summary>全対戦を見る <span id="scheduleCount" class="progress"></span></summary>
    <div class="schedule-body"><div id="schedule" class="schedule-grid"></div></div>
  </details>

  <details class="setup">
    <summary><span>大会設定</span></summary>
    <div class="setup-body">
      <div class="setup-grid"><div><label class="label" for="playerCount">参加人数</label><select id="playerCount" class="select"></select></div><div><label class="label" for="titleInput">大会名</label><input id="titleInput" class="text" maxlength="40"></div></div>
      <span class="label">参加者名</span><div id="playerInputs" class="player-inputs"></div>
      <div class="setup-actions"><button id="applyButton" class="btn btn-accent">設定を反映</button><button id="importButton" class="btn">読込</button><button id="resetResults" class="btn btn-danger">結果リセット</button><button id="resetAll" class="btn btn-danger">全初期化</button><input id="importFile" type="file" accept="application/json" hidden></div>
    </div>
  </details>
</main>

<div id="resultEditor" class="result-editor" hidden role="dialog" aria-modal="true" aria-labelledby="resultEditorTitle">
  <div class="result-editor-card">
    <div class="result-editor-head">
      <div><p class="result-editor-kicker">RESULT CORRECTION</p><h2 id="resultEditorTitle">結果を修正</h2></div>
      <button id="resultClose" class="result-close" type="button" aria-label="閉じる">×</button>
    </div>
    <p id="resultMatchLabel" class="result-match-label"></p>
    <p class="result-editor-help">正しい勝者を選ぶか、結果を未対戦に戻してください。</p>
    <div class="result-choice-grid">
      <button id="resultPlayerA" class="result-choice" type="button"></button>
      <button id="resultPlayerB" class="result-choice" type="button"></button>
    </div>
    <button id="resultClear" class="result-clear" type="button">未対戦に戻す</button>
  </div>
</div>

<script src="/pokemon-round-robin.js?v=12"></script>
</body>
</html>
